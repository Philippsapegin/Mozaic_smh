[package]
name = "mozaic"
version = "1.0.4"
description = "Offline image editor for journalists"
edition = "2021"

[lib]
name = "mozaic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde_json = "1"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
